name: CI

on:
  push:
    branches: ["**"]
    tags-ignore: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  MISE_ENV: ci
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  check:
    name: Format, clippy and tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: mise run lint
      - run: mise run test

  deny:
    name: Advisories and licences
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
      - run: mise run deny

  release-build:
    name: Release build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: release
      - run: mise run build
      - name: Report sizes
        run: |
          ls -l target/release/nanobom target/site/pkg

  image:
    name: Container image (${{ matrix.architecture }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            runner: ubuntu-24.04
          - architecture: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: nanobom:ci
          platforms: linux/${{ matrix.architecture }}
          cache-from: type=gha,scope=image-${{ matrix.architecture }}
          cache-to: type=gha,scope=image-${{ matrix.architecture }},mode=max
      - name: Start the image and wait until it reports healthy
        run: |
          docker run --detach --name nanobom --publish 8080:8080 nanobom:ci
          for attempt in $(seq 1 30); do
            status=$(docker inspect --format '{{.State.Health.Status}}' nanobom)
            echo "health: $status"
            if [ "$status" = healthy ]; then
              curl --fail --silent http://localhost:8080/login > /dev/null
              exit 0
            fi
            sleep 5
          done
          docker logs nanobom
          exit 1
      - name: Report size
        run: docker image ls nanobom:ci

name: CI

on:
  push:
    branches: ["**"]
    tags-ignore: ["**"]
  pull_request:
    # `edited` re-checks the title when it changes; only the title check runs then.
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

concurrency:
  # Title edits get their own group, so they never cancel a build in progress.
  group: ci-${{ github.ref }}-${{ github.event.action == 'edited' && 'title' || 'build' }}
  cancel-in-progress: true

env:
  MISE_ENV: ci
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  # Pull requests are squash-merged, so the title becomes the commit on main, from which
  # release-plz derives the version bump and the changelog (see RELEASING.md).
  pr-title:
    name: Pull request title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - name: Check that the title follows Conventional Commits
        run: |
          pattern='^(feat|fix|perf|refactor|docs|test|ci|build|chore|style|revert)(\([a-z0-9_-]+\))?!?: [^ ].*$'
          if printf '%s' "$TITLE" | grep -Eq "$pattern"; then
            echo "Valid title: $TITLE"
          else
            echo "::error::The title must follow Conventional Commits, such as 'feat: add SPDX uploads', 'fix(osv): retry on timeouts' or 'feat!: change the webhook payload'. Got: $TITLE"
            exit 1
          fi
        env:
          TITLE: ${{ github.event.pull_request.title }}

  check:
    if: github.event.action != 'edited'
    name: Format, clippy and tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: mise run lint
      - run: mise run test

  coverage:
    if: github.event.action != 'edited'
    name: Coverage
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: coverage
      - run: mise run coverage
      - name: Summarize
        run: |
          {
            echo '## Coverage'
            echo '```'
            mise exec -- cargo llvm-cov report --summary-only $NANOBOM_SERVER_PACKAGES | tail -1
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      # Authenticated with GitHub's OIDC token: no Codecov secret to store.
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          use_oidc: true
          files: lcov.info
          disable_search: true
          fail_ci_if_error: true

  deny:
    if: github.event.action != 'edited'
    name: Advisories and licences
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
      - run: mise run deny

  release-build:
    if: github.event.action != 'edited'
    name: Release build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: release
      - run: mise run build
      - name: Report sizes
        run: |
          ls -l target/release/nanobom target/site/pkg

  image:
    if: github.event.action != 'edited'
    name: Container image (${{ matrix.architecture }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            runner: ubuntu-24.04
          - architecture: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: nanobom:ci
          platforms: linux/${{ matrix.architecture }}
          cache-from: type=gha,scope=image-${{ matrix.architecture }}
          cache-to: type=gha,scope=image-${{ matrix.architecture }},mode=max
      # Through compose.yaml, so the file users start from is tested too.
      - name: Start the image and wait until it reports healthy
        run: |
          if ! docker compose up --detach --no-build --wait --wait-timeout 150; then
            docker compose logs
            exit 1
          fi
          curl --fail --silent http://localhost:8080/login > /dev/null
        env:
          NANOBOM_IMAGE: nanobom:ci
      - name: Report size
        run: docker image ls nanobom:ci

name: CI

on:
  # Other branches are checked through their pull request, so each commit is built once.
  push:
    branches: [main]
    tags-ignore: ["**"]
  # The pull request title is checked by pr-title.yml: a title edit must not start a run here,
  # since its skipped jobs would replace the results of the real run on the same commit.
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  MISE_ENV: ci
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  check:
    name: Format, clippy and tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: jdx/mise-action@v5.2.7
      - uses: Swatinem/rust-cache@v2.9.3
      - run: mise run lint
      - run: mise run doc
      - run: mise run test

  postgres:
    name: Tests on PostgreSQL
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: nanobom
          POSTGRES_PASSWORD: nanobom
          POSTGRES_DB: nanobom
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready --username nanobom --dbname nanobom"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NANOBOM_TEST_DATABASE_URL: postgres://nanobom:nanobom@localhost:5432/nanobom
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: jdx/mise-action@v5.2.7
      - uses: Swatinem/rust-cache@v2.9.3
      - run: mise run test-postgres

  coverage:
    name: Coverage
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: jdx/mise-action@v5.2.7
      - uses: Swatinem/rust-cache@v2.9.3
        with:
          key: coverage
      - run: mise run coverage
      - name: Summarize
        run: |
          {
            echo '## Coverage'
            echo '```'
            mise exec -- cargo llvm-cov report --summary-only $NANOBOM_SERVER_PACKAGES | tail -1
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      # Pull requests from forks get no secrets; Codecov accepts their uploads without a token.
      - uses: codecov/codecov-action@v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: lcov.info
          disable_search: true
          # Dependabot pull requests see no Actions secrets, so their upload has no token; their
          # coverage is still measured and shown in the job summary.
          fail_ci_if_error: ${{ github.actor != 'dependabot[bot]' }}

  deny:
    name: Advisories and licences
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: jdx/mise-action@v5.2.7
      - run: mise run deny

  release-build:
    name: Release build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: jdx/mise-action@v5.2.7
      - uses: Swatinem/rust-cache@v2.9.3
        with:
          key: release
      - run: mise run build
      - name: Report sizes
        run: |
          ls -l target/release/nanobom target/site/pkg

  image:
    name: Container image (${{ matrix.architecture }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            runner: ubuntu-24.04
          - architecture: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: docker/setup-buildx-action@v4.4.1
      - uses: docker/build-push-action@v7.4.0
        with:
          context: .
          load: true
          tags: nanobom:ci
          platforms: linux/${{ matrix.architecture }}
          cache-from: type=gha,scope=image-${{ matrix.architecture }}
          cache-to: type=gha,scope=image-${{ matrix.architecture }},mode=max
      # Through compose.yaml, so the file users start from is tested too.
      - name: Start the image and wait until it reports healthy
        run: |
          if ! docker compose up --detach --no-build --wait --wait-timeout 150; then
            docker compose logs
            exit 1
          fi
          curl --fail --silent http://localhost:8080/login > /dev/null
        env:
          NANOBOM_IMAGE: nanobom:ci
      # The PostgreSQL example too: healthy means the migrations ran on PostgreSQL.
      - name: Start the image on PostgreSQL and wait until it reports healthy
        run: |
          docker compose down
          if ! docker compose -f examples/compose-postgres.yaml up --detach --wait --wait-timeout 150; then
            docker compose -f examples/compose-postgres.yaml logs
            exit 1
          fi
          curl --fail --silent http://localhost:8080/login > /dev/null
        env:
          NANOBOM_IMAGE: nanobom:ci
      - name: Report size
        run: docker image ls nanobom:ci

  # The one check branch protection requires: it fails unless every job above succeeded, so
  # adding a job here needs no change to the repository settings. Coverage is left out: its
  # upload depends on Codecov being up, and the tests it runs already run in `check`.
  passed:
    name: CI passed
    if: always()
    needs: [check, postgres, deny, release-build, image]
    runs-on: ubuntu-24.04
    steps:
      - name: Check that every job succeeded
        run: |
          echo "$RESULTS" | jq --exit-status 'all(.[]; .result == "success")' > /dev/null || {
            echo "$RESULTS" | jq --raw-output 'to_entries[] | "\(.key): \(.value.result)"'
            echo "::error::A required job did not succeed"
            exit 1
          }
        env:
          RESULTS: ${{ toJSON(needs) }}

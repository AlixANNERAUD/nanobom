name: CI

on:
  # Other branches are checked through their pull request, so each commit is built once.
  push:
    branches: [main]
    tags-ignore: ["**"]
  pull_request:
    # `edited` re-checks the title when it changes; only the title check runs then.
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

concurrency:
  # Title edits get their own group, so they never cancel a build in progress.
  group: ci-${{ github.ref }}-${{ github.event.action == 'edited' && 'title' || 'build' }}
  cancel-in-progress: true

env:
  MISE_ENV: ci
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  # Pull requests are squash-merged, so the title becomes the commit on main, from which
  # release-plz derives the version bump and the changelog (see RELEASING.md).
  pr-title:
    name: Pull request title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - name: Check that the title follows Conventional Commits
        run: |
          pattern='^(feat|fix|perf|refactor|docs|test|ci|build|chore|style|revert)(\([a-z0-9_-]+\))?!?: [^ ].*$'
          if printf '%s' "$TITLE" | grep -Eq "$pattern"; then
            echo "Valid title: $TITLE"
          else
            echo "::error::The title must follow Conventional Commits, such as 'feat: add SPDX uploads', 'fix(osv): retry on timeouts' or 'feat!: change the webhook payload'. Got: $TITLE"
            exit 1
          fi
        env:
          TITLE: ${{ github.event.pull_request.title }}

  check:
    if: github.event.action != 'edited'
    name: Format, clippy and tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: jdx/mise-action@v5.2.7
      - uses: Swatinem/rust-cache@v2.9.3
      - run: mise run lint
      - run: mise run doc
      - run: mise run test

  postgres:
    if: github.event.action != 'edited'
    name: Tests on PostgreSQL
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: nanobom
          POSTGRES_PASSWORD: nanobom
          POSTGRES_DB: nanobom
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready --username nanobom --dbname nanobom"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NANOBOM_TEST_DATABASE_URL: postgres://nanobom:nanobom@localhost:5432/nanobom
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: jdx/mise-action@v5.2.7
      - uses: Swatinem/rust-cache@v2.9.3
      - run: mise run test-postgres

  coverage:
    if: github.event.action != 'edited'
    name: Coverage
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: jdx/mise-action@v5.2.7
      - uses: Swatinem/rust-cache@v2.9.3
        with:
          key: coverage
      - run: mise run coverage
      - name: Summarize
        run: |
          {
            echo '## Coverage'
            echo '```'
            mise exec -- cargo llvm-cov report --summary-only $NANOBOM_SERVER_PACKAGES | tail -1
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      # Pull requests from forks get no secrets; Codecov accepts their uploads without a token.
      - uses: codecov/codecov-action@v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: lcov.info
          disable_search: true
          # Dependabot pull requests see no Actions secrets, so their upload has no token; their
          # coverage is still measured and shown in the job summary.
          fail_ci_if_error: ${{ github.actor != 'dependabot[bot]' }}

  deny:
    if: github.event.action != 'edited'
    name: Advisories and licences
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: jdx/mise-action@v5.2.7
      - run: mise run deny

  release-build:
    if: github.event.action != 'edited'
    name: Release build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: jdx/mise-action@v5.2.7
      - uses: Swatinem/rust-cache@v2.9.3
        with:
          key: release
      - run: mise run build
      - name: Report sizes
        run: |
          ls -l target/release/nanobom target/site/pkg

  image:
    if: github.event.action != 'edited'
    name: Container image (${{ matrix.architecture }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            runner: ubuntu-24.04
          - architecture: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: docker/setup-buildx-action@v4.4.1
      - uses: docker/build-push-action@v7.4.0
        with:
          context: .
          load: true
          tags: nanobom:ci
          platforms: linux/${{ matrix.architecture }}
          cache-from: type=gha,scope=image-${{ matrix.architecture }}
          cache-to: type=gha,scope=image-${{ matrix.architecture }},mode=max
      # Through compose.yaml, so the file users start from is tested too.
      - name: Start the image and wait until it reports healthy
        run: |
          if ! docker compose up --detach --no-build --wait --wait-timeout 150; then
            docker compose logs
            exit 1
          fi
          curl --fail --silent http://localhost:8080/login > /dev/null
        env:
          NANOBOM_IMAGE: nanobom:ci
      # The PostgreSQL example too: healthy means the migrations ran on PostgreSQL.
      - name: Start the image on PostgreSQL and wait until it reports healthy
        run: |
          docker compose down
          if ! docker compose -f examples/compose-postgres.yaml up --detach --wait --wait-timeout 150; then
            docker compose -f examples/compose-postgres.yaml logs
            exit 1
          fi
          curl --fail --silent http://localhost:8080/login > /dev/null
        env:
          NANOBOM_IMAGE: nanobom:ci
      - name: Report size
        run: docker image ls nanobom:ci

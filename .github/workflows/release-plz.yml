name: Release-plz

# On every push to main: keeps a release PR open with the next version and its changelog, and,
# once that PR is merged, tags the version, drafts the GitHub release and calls release.yml to
# build, attach and publish everything. See RELEASING.md.
on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  release:
    name: Tag and draft the release
    if: github.repository_owner == 'AlixANNERAUD'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: read
    outputs:
      created: ${{ steps.release-plz.outputs.releases_created }}
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@v5.2.7
        env:
          MISE_ENV: ci
      - id: release-plz
        uses: release-plz/action@v0.5.148
        with:
          command: release
          version: 0.4.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - id: tag
        if: steps.release-plz.outputs.releases_created == 'true'
        run: echo "tag=$(jq --raw-output '.[] | select(.package_name == "nanobom") | .tag' <<< "$RELEASES")" >> "$GITHUB_OUTPUT"
        env:
          RELEASES: ${{ steps.release-plz.outputs.releases }}

  # Called rather than triggered by the tag: tags pushed with GITHUB_TOKEN start no workflow.
  publish:
    name: Publish
    needs: release
    if: needs.release.outputs.created == 'true' && needs.release.outputs.tag != ''
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.release.outputs.tag }}
    secrets:
      NANOBOM_IMAGE_TOKEN: ${{ secrets.NANOBOM_IMAGE_TOKEN }}

  release-pr:
    name: Update the release PR
    if: github.repository_owner == 'AlixANNERAUD'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: release-plz-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@v5.2.7
        env:
          MISE_ENV: ci
      - uses: release-plz/action@v0.5.148
        with:
          command: release-pr
          version: 0.4.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: Release

# Publishes a release for each version tag: Linux archives (binary and site) for x86_64 and
# aarch64, and a multi-architecture container image on the GitHub Container Registry. Both
# architectures build natively on their own runners.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build (${{ matrix.architecture }})
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      matrix:
        include:
          - architecture: amd64
            target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
          - architecture: arm64
            target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Name the image
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      # The archive comes from the same build stage as the image, so the binary links against
      # the image's Debian 12 glibc rather than the runner's.
      - name: Build the archive contents
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: artifact
          platforms: linux/${{ matrix.architecture }}
          outputs: type=local,dest=out
          cache-from: type=gha,scope=release-${{ matrix.architecture }}
          cache-to: type=gha,scope=release-${{ matrix.architecture }},mode=max
      - name: Package the archive
        run: |
          name="nanobom-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir "$name"
          cp -r out/nanobom out/site LICENSE "$name/"
          chmod +x "$name/nanobom"
          tar --create --gzip --file "$name.tar.gz" "$name"
          sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: nanobom-*.tar.gz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: archive-${{ matrix.architecture }}
          path: nanobom-*.tar.gz*
          if-no-files-found: error

      - name: Build and push the image by digest
        id: image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/${{ matrix.architecture }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=release-${{ matrix.architecture }}
          provenance: mode=max
      - name: Export the digest
        run: |
          mkdir -p digests
          touch "digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ matrix.architecture }}
          path: digests/*
          if-no-files-found: error

  image:
    name: Publish the image
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digest-*
          path: digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Name the image
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          # Pre-releases (v1.2.0-rc.1) get their exact version only.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
      - name: Merge the architectures into one tag
        working-directory: digests
        run: |
          docker buildx imagetools create \
            $(jq --raw-output '.tags | map("--tag " + .) | join(" ")' <<< "$METADATA") \
            $(printf "$IMAGE@sha256:%s " *)
        env:
          METADATA: ${{ steps.metadata.outputs.json }}
      - name: Inspect the image
        run: docker buildx imagetools inspect "$IMAGE:${{ steps.metadata.outputs.version }}"

  release:
    name: GitHub release
    needs: [build, image]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: archive-*
          path: archives
          merge-multiple: true
      - name: Create the release
        run: |
          prerelease=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then prerelease=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" archives/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "nanobom $GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag \
            "${prerelease[@]}"
        env:
          GH_TOKEN: ${{ github.token }}

name: Release

# Builds and publishes a release: Linux archives (binary and site) for x86_64 and aarch64,
# attached to the GitHub release, and a multi-architecture container image on the GitHub
# Container Registry. Both architectures build natively on their own runners.
#
# release-plz.yml calls it after tagging a merged release PR. A version tag pushed by hand also
# starts it (for a release of changes outside the crates, such as the Dockerfile), and it can be
# run again for an existing tag from the Actions tab.
on:
  workflow_call:
    inputs:
      tag:
        description: Version tag to release, such as v1.2.3
        type: string
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: Version tag to release, such as v1.2.3
        type: string
        required: true
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]

permissions:
  contents: read

env:
  TAG: ${{ inputs.tag || github.ref_name }}

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    name: Build (${{ matrix.architecture }})
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      matrix:
        include:
          - architecture: amd64
            target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
          - architecture: arm64
            target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ env.TAG }}
      - uses: docker/setup-buildx-action@v4.4.1
      - uses: docker/login-action@v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Name the image
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      # The archive comes from the same build stage as the image, so the binary links against
      # the image's Debian 12 glibc rather than the runner's.
      - name: Build the archive contents
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          target: artifact
          platforms: linux/${{ matrix.architecture }}
          outputs: type=local,dest=out
          cache-from: type=gha,scope=release-${{ matrix.architecture }}
          cache-to: type=gha,scope=release-${{ matrix.architecture }},mode=max
      - name: Package the archive
        run: |
          name="nanobom-${TAG}-${{ matrix.target }}"
          mkdir "$name"
          cp -r out/nanobom out/site LICENSE "$name/"
          chmod +x "$name/nanobom"
          tar --create --gzip --file "$name.tar.gz" "$name"
          sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"
      - uses: actions/attest-build-provenance@v4.2.2
        with:
          subject-path: nanobom-*.tar.gz
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: archive-${{ matrix.architecture }}
          path: nanobom-*.tar.gz*
          if-no-files-found: error

      - name: Build and push the image by digest
        id: image
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          platforms: linux/${{ matrix.architecture }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=release-${{ matrix.architecture }}
          provenance: mode=max
      - name: Export the digest
        run: |
          mkdir -p digests
          touch "digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: digest-${{ matrix.architecture }}
          path: digests/*
          if-no-files-found: error

  image:
    name: Publish the image
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: digest-*
          path: digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@v4.4.1
      - uses: docker/login-action@v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Name the image
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - id: metadata
        uses: docker/metadata-action@v6.2.0
        with:
          images: ${{ env.IMAGE }}
          # Pre-releases get no `latest`, minor or major tag.
          tags: |
            type=semver,pattern={{version}},value=${{ env.TAG }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.TAG }}
            type=semver,pattern={{major}},value=${{ env.TAG }}
      - name: Merge the architectures into one tag
        working-directory: digests
        run: |
          docker buildx imagetools create \
            $(jq --raw-output '.tags | map("--tag " + .) | join(" ")' <<< "$METADATA") \
            $(printf "$IMAGE@sha256:%s " *)
        env:
          METADATA: ${{ steps.metadata.outputs.json }}
      - name: Inspect the image
        run: docker buildx imagetools inspect "$IMAGE:${{ steps.metadata.outputs.version }}"

  release:
    name: GitHub release
    needs: [build, image]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: archive-*
          path: archives
          merge-multiple: true
      # release-plz drafts the release with the changelog; a hand-pushed tag has none yet.
      - name: Attach the archives and publish the release
        run: |
          prerelease=false
          if [[ "$TAG" == *-* ]]; then prerelease=true; fi
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$TAG" archives/* --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" \
              --draft=false --prerelease="$prerelease"
          else
            gh release create "$TAG" archives/* --repo "$GITHUB_REPOSITORY" \
              --title "nanobom $TAG" --generate-notes --verify-tag --prerelease="$prerelease"
          fi
        env:
          GH_TOKEN: ${{ github.token }}

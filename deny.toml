[graph]
all-features = false

[advisories]
version = 2
yanked = "deny"
ignore = [
  # Unmaintained, not vulnerable: a compile-time macro pulled in by Leptos.
  { id = "RUSTSEC-2024-0436", reason = "build-time dependency of Leptos, no known vulnerability" },
  # Timing attack on private-key RSA operations; openidconnect only verifies ID token signatures
  # with the provider's public key.
  { id = "RUSTSEC-2023-0071", reason = "rsa is only used for public-key signature verification" },
  # SQLite bundled by libsqlite3-sys up to 0.38.2; sqlx-sqlite 0.9.0 requires <0.38, so the fixed
  # 0.39 cannot be used yet (#73). Exploiting it needs a database file and its -wal written by a
  # less trusted party: nanobom only opens its own database, or a backup the operator restores.
  { id = "RUSTSEC-2026-0459", reason = "nanobom only opens its own database; upgrade tracked in #73" },
]

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
  # Zero-clause BSD, permissive without even an attribution requirement: quoted_printable, used
  # by lettre to encode emails.
  "0BSD",
  "MIT",
  "MIT-0",
  "ISC",
  "CDLA-Permissive-2.0",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "Zlib",
  "Unicode-3.0",
  "BSL-1.0",
  "CC0-1.0",
]

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true
deny = [
  { name = "openssl-sys", reason = "rustls only" },
  { name = "native-tls", reason = "rustls only" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
# embedded-i18n, until the release adding per-call locales.
allow-git = ["https://github.com/AlixANNERAUD/embedded_i18n"]

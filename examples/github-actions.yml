# Uploads the SBOM of a Rust project to nanobom on every push to main, with the nanobom action
# (https://github.com/AlixANNERAUD/nanobom-action). The job summary lists the project's open
# findings.
# Secrets: NANOBOM_TOKEN (an upload token of the organization). Variables: NANOBOM_URL.
#
# fail-on: high fails the job when the project has open findings of high severity or above once
# evaluated; use critical, medium, low or exploited (known exploited only) instead, or remove it
# to only record the SBOM. Without `sbom`, the action generates one with Syft.
name: SBOM

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  sbom:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Generate the SBOM
        run: |
          cargo install cargo-cyclonedx --locked
          cargo cyclonedx --format json --override-filename sbom
      - uses: AlixANNERAUD/nanobom-action@v1
        with:
          url: ${{ vars.NANOBOM_URL }}
          token: ${{ secrets.NANOBOM_TOKEN }}
          organization: acme
          sbom: sbom.json
          fail-on: high

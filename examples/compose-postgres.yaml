# nanobom with its database on PostgreSQL, in a second container.
#
#   docker compose -f examples/compose-postgres.yaml up -d --wait
#   docker compose -f examples/compose-postgres.yaml exec nanobom /app/nanobom create-administrator --username admin
#
# Set NANOBOM_POSTGRES_PASSWORD (in the environment or a `.env` file next to this one) before
# exposing the instance; it is part of a URL, so keep it to letters, digits and `-._~` or
# percent-encode it. Back the database up with pg_dump: `nanobom backup` copies SQLite only.
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: nanobom
      POSTGRES_PASSWORD: ${NANOBOM_POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: nanobom
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "--username", "nanobom", "--dbname", "nanobom"]
      interval: 5s
      timeout: 5s
      retries: 10

  nanobom:
    image: ${NANOBOM_IMAGE:-ghcr.io/alixanneraud/nanobom:latest}
    restart: unless-stopped
    # nanobom migrates the database at startup, so it waits until PostgreSQL accepts connections.
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      NANOBOM_DATABASE_URL: postgres://nanobom:${NANOBOM_POSTGRES_PASSWORD:-change-me}@postgres:5432/nanobom
      # The address users reach nanobom at: links, cookies and sign-in redirects use it.
      NANOBOM_PUBLIC_URL: ${NANOBOM_PUBLIC_URL:-http://localhost:8080}
      # Re-evaluate every project each night (cron, UTC), and after each upload.
      NANOBOM_SCHEDULE: "0 3 * * *"
    # The image checks itself with `nanobom healthcheck`; `--wait` waits for it.

volumes:
  postgres-data:

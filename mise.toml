[tools]
rust = { version = "1.99.1", components = "rustfmt,clippy,llvm-tools", targets = "wasm32-unknown-unknown", mr_boxington = true }
mr-boxington = "latest"
"github:leptos-rs/cargo-leptos" = "0.3.11"
"aqua:nextest-rs/nextest/cargo-nextest" = "0.9.149"
"aqua:EmbarkStudios/cargo-deny" = "0.20.2"
"aqua:taiki-e/cargo-llvm-cov" = "0.9.1"
"github:SeaQL/sea-orm" = { version = "2.0.4", version_prefix = "sea-orm-cli@", bin = "sea-orm-cli" }
# Must match the wasm-bindgen version in Cargo.lock. The statically linked (musl) build runs on
# any Linux, including the Debian 12 image builder whose glibc is older than the gnu build needs.
"github:wasm-bindgen/wasm-bindgen" = { version = "0.2.130", matching = "unknown-linux-musl" }
# cargo-leptos uses these from the PATH instead of downloading them at each clean build (GitHub
# refusing those downloads was failing builds). The versions are cargo-leptos 0.3.11's defaults.
"github:WebAssembly/binaryen" = { version = "123", version_prefix = "version_" }
"aqua:tailwindlabs/tailwindcss" = "4.2.1"
# Builds the documentation in docs/ (mise run docs).
"github:rust-lang/mdBook" = { version = "0.5.4", bin = "mdbook" }

[env]
# The browser bundle is built separately for wasm32, so server-side commands leave it out to
# avoid unifying the `ssr` and `hydrate` features of the interface crate.
NANOBOM_SERVER_PACKAGES = "--workspace --exclude nanobom-frontend"

[tasks.format]
description = "Format the code"
run = "cargo fmt --all"

[tasks.lint]
description = "Check formatting and run clippy on the server and browser code"
run = [
  "cargo fmt --all --check",
  "cargo clippy $NANOBOM_SERVER_PACKAGES --all-targets -- -D warnings",
  "cargo clippy --package nanobom-frontend --target wasm32-unknown-unknown -- -D warnings",
]

[tasks.test]
description = "Run the test suite"
run = "cargo nextest run $NANOBOM_SERVER_PACKAGES --no-tests=pass"

[tasks.coverage]
description = "Run the test suite with coverage, writing lcov.info"
run = "cargo llvm-cov nextest $NANOBOM_SERVER_PACKAGES --no-tests=pass --lcov --output-path lcov.info"

[tasks.deny]
description = "Check advisories, licences, bans and sources"
run = "cargo deny check"

[tasks.check]
description = "Everything CI checks, except the release build"
depends = ["lint", "test", "deny"]

[tasks.docs]
description = "Build the documentation into docs/book"
run = "mdbook build docs"

# cargo-leptos 0.3.11 reads the binary's arguments from its command line only (there is no
# `bin-args` key in the workspace metadata), hence `-- serve`. The environment replaces the
# container defaults (/data, port 8080, JSON logs) with a local, throwaway setup; cargo-leptos
# itself runs with `site-addr` and `site-root` from Cargo.toml, which these values must match.
[tasks.dev]
description = "Run the server with live reload on http://127.0.0.1:3000"
run = [
  "mkdir -p target/dev",
  "cargo leptos watch -- serve",
]

[tasks.dev.env]
NANOBOM_DATABASE_URL = "sqlite://target/dev/nanobom.db?mode=rwc"
NANOBOM_SITE_ROOT = "target/site"
NANOBOM_LISTEN_ADDRESS = "127.0.0.1:3000"
NANOBOM_PUBLIC_URL = "http://127.0.0.1:3000"
NANOBOM_LOG_FORMAT = "text"
NANOBOM_SCHEDULE = "off"

[tasks.dev-admin]
description = "Create an administrator in the development database (asks for the password)"
run = "cargo run --quiet --package nanobom -- create-administrator --username admin"

[tasks.dev-admin.env]
NANOBOM_DATABASE_URL = "sqlite://target/dev/nanobom.db?mode=rwc"
NANOBOM_LOG_FORMAT = "text"

[tasks.build]
description = "Build the release binary and the site"
run = "cargo leptos build --release"

[tasks.entities]
description = "Regenerate the SeaORM entities from the migrations"
run = '''
directory=$(mktemp -d)
cargo run --quiet --package nanobom -- --log-level warn migrate --database-url "sqlite://$directory/schema.db"
rm -rf crates/entity/src/entities
sea-orm-cli generate entity --database-url "sqlite://$directory/schema.db" --output-dir crates/entity/src/entities --with-serde both --date-time-crate chrono --ignore-tables seaql_migrations --banner-version off
rm -rf "$directory"
cargo fmt --package nanobom-entity
'''
